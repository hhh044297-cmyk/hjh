<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻名问迹 - 专属视觉艺术史诗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 动态颜色变量，将被JS覆盖 */
            --color-p1: #5C7A99; 
            --color-p2: #E6B8A2; 
            
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0a0a0f; overflow: hidden;
            color: white; font-family: 'Noto Serif SC', serif;
        }

        /* 隐藏系统鼠标 */
        body, html, * { cursor: none !important; }
        
        .cursor-dot {
            position: fixed; top: 0; left: 0; width: 6px; height: 6px;
            background: white; border-radius: 50%; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%); mix-blend-mode: difference;
        }
        .cursor-ring {
            position: fixed; top: 0; left: 0; width: 40px; height: 40px;
            border: 1px solid rgba(255,255,255,0.4); border-radius: 50%;
            pointer-events: none; z-index: 9998; transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s, border-color 0.3s;
            mix-blend-mode: difference;
        }
        .cursor-ring.hovering {
            width: 80px; height: 80px; background: rgba(255,255,255,0.1);
            border-color: transparent; backdrop-filter: blur(2px);
        }

        /* 环境光与质感 */
        #ambient-light {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -3; transition: background 2s cubic-bezier(0.19, 1, 0.22, 1);
            background: radial-gradient(circle at 50% 50%, #1c1c28 0%, #0a0a0f 100%);
        }
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 5; opacity: 0.15; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .cursive { font-family: 'Zhi Mang Xing', cursive; }
        
        /* 动态色彩类 */
        .text-p1 { color: var(--color-p1); }
        .text-p2 { color: var(--color-p2); }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        
        #app-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
        }

        /* 液体扭曲滤镜应用层 */
        #scene-container {
            position: absolute; width: 100%; height: 100%; filter: url(#liquid-distortion);
            display: none; /* 初始隐藏，生成后显示 */
        }

        /* 场景切换样式 */
        .scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transform: translateZ(-200px) scale(0.8); filter: blur(20px);
            transition: all 1.8s cubic-bezier(0.19, 1, 0.22, 1); pointer-events: none;
        }
        .scene.active { opacity: 1; visibility: visible; transform: translateZ(0) scale(1); filter: blur(0px); pointer-events: auto; z-index: 20; }
        .scene.past { opacity: 0; visibility: hidden; transform: translateZ(300px) scale(1.5); filter: blur(15px); }

        /* 动画元素 */
        .anim-element { opacity: 0; transform: translateY(50px) scale(0.95); transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1); }
        .active .anim-element { opacity: 1; transform: translateY(0) scale(1); }
        .delay-100 { transition-delay: 0.1s; } .delay-300 { transition-delay: 0.3s; }
        .delay-500 { transition-delay: 0.5s; } .delay-700 { transition-delay: 0.7s; }
        .delay-900 { transition-delay: 0.9s; }

        .text-hollow { color: transparent; transition: all 1.5s ease; }
        .active .text-hollow-p1 { -webkit-text-stroke: 2px var(--color-p1); text-shadow: 0 0 40px rgba(255,255,255,0.2); }
        .active .text-hollow-p2 { -webkit-text-stroke: 2px var(--color-p2); text-shadow: 0 0 40px rgba(255,255,255,0.2); }

        .glow-line { width: 0px; height: 1px; background: linear-gradient(90deg, transparent, white, transparent); box-shadow: 0 0 10px white; transition: width 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.5s; }
        .active .glow-line { width: 300px; }
        
        .scroll-indicator {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100;
            display: none; flex-direction: column; align-items: center; opacity: 0.5; transition: opacity 0.5s; pointer-events: none;
        }
        .scroll-indicator p { font-size: 10px; letter-spacing: 0.3em; margin-bottom: 8px; text-transform: uppercase; }
        .mouse-wheel {
            width: 20px; height: 30px; border: 1px solid white; border-radius: 10px; position: relative;
        }
        .mouse-wheel::before {
            content: ''; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
            width: 2px; height: 6px; background: white; border-radius: 2px; animation: scrollWheel 2s infinite;
        }
        @keyframes scrollWheel { 0% { top: 5px; opacity: 1; } 100% { top: 15px; opacity: 0; } }

        /* 入口表单界面 */
        #landing-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; transition: opacity 1s ease;
        }
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
            border-radius: 16px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); padding: 3rem; width: 90%; max-width: 500px;
        }
        .custom-input {
            background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.3);
            color: white; font-family: 'Noto Serif SC', serif; font-size: 1.2rem; padding: 10px 5px; width: 100%;
            transition: all 0.3s; outline: none; cursor: none; text-align: center;
        }
        .custom-input:focus { border-bottom: 1px solid white; box-shadow: 0 1px 0 0 white; }
        .custom-input::placeholder { color: rgba(255,255,255,0.2); font-weight: 200; letter-spacing: 2px; }
        .btn-ai {
            background: transparent; color: white; border: 1px solid white; padding: 12px 32px;
            font-family: 'Noto Serif SC', serif; letter-spacing: 4px; border-radius: 30px; cursor: none;
            transition: all 0.4s ease; position: relative; overflow: hidden; text-transform: uppercase; margin-top: 2rem; width: 100%;
        }
        .btn-ai:hover { background: white; color: black; box-shadow: 0 0 20px rgba(255,255,255,0.4); }

        /* 加载动画 */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 60;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            background: #0a0a0f; transition: opacity 1s ease;
        }
        .vortex-loader {
            width: 80px; height: 80px; border: 2px solid transparent; border-top-color: #fff; border-bottom-color: #777;
            border-radius: 50%; animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; margin-bottom: 2rem;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 1.2rem; letter-spacing: 0.5em; color: #ccc; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- 顶级 SVG 液体扭曲滤镜 -->
    <svg style="position: absolute; width: 0; height: 0; z-index: -1;">
        <filter id="liquid-distortion">
            <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" result="noise" id="fe-turb" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" id="fe-disp" />
        </filter>
    </svg>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <div id="ambient-light"></div>
    <div class="noise-overlay"></div>
    <canvas id="bg-canvas"></canvas>

    <div id="app-container">
        <!-- 1. 入口页 -->
        <div id="landing-screen">
            <div class="text-center mb-12">
                <h1 class="cursive text-7xl md:text-8xl mb-4 text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500">寻名问迹</h1>
                <p class="text-sm tracking-[0.8em] text-gray-400 pl-[0.8em] uppercase">Generative Identity Art</p>
            </div>
            <div class="glass-panel text-center">
                <p class="text-gray-300 mb-8 font-light leading-relaxed">
                    万物皆有回响，名字亦是道场。<br>输入您的名字，AI 将为您生成专属的美学史诗幻灯片。
                </p>
                <input type="text" id="input-name" class="custom-input mb-6" placeholder="输入姓名，如：李白" autocomplete="off" maxlength="10">
                <input type="text" id="input-aspiration" class="custom-input" placeholder="当下心境，如：求索、破局" autocomplete="off" maxlength="20">
                <button id="btn-generate" class="btn-ai">生成专属史诗</button>
            </div>
        </div>

        <!-- 2. 加载页 -->
        <div id="loading-screen">
            <div class="vortex-loader"></div>
            <div class="loading-text cursive" id="loading-msg">正在链接星辰引力...</div>
        </div>

        <!-- 3. 动态演示页 -->
        <div id="scene-container">
            <!-- 场景将由 JS 动态生成并注入于此 -->
        </div>
    </div>

    <div class="scroll-indicator" id="indicator">
        <p>Scroll / Swipe</p>
        <div class="mouse-wheel"></div>
    </div>

    <script>
        const apiKey = "AIzaSyCSciPeHNstALkmZ5XzDXQpFik9sZM-BUU"; 
        let scenes = [];
        let currentScene = 0;
        let isAnimating = false;
        
        let globalMouseX = window.innerWidth / 2;
        let globalMouseY = window.innerHeight / 2;

        /* ==================== 高定光标 ==================== */
        const cursorDot = document.getElementById('cursor-dot');
        const cursorRing = document.getElementById('cursor-ring');
        let cursorX = window.innerWidth / 2, cursorY = window.innerHeight / 2;
        let ringX = cursorX, ringY = cursorY;

        function renderCursor() {
            if(!cursorRing || !cursorDot) return;
            ringX += (cursorX - ringX) * 0.15; 
            ringY += (cursorY - ringY) * 0.15;
            cursorRing.style.transform = `translate(${ringX}px, ${ringY}px)`;
            requestAnimationFrame(renderCursor);
        }
        renderCursor();

        function bindCursorHover() {
            if(!cursorRing) return;
            const hoverElements = document.querySelectorAll('button, input, .custom-input, .mouse-wheel');
            hoverElements.forEach(el => {
                el.addEventListener('mouseenter', () => cursorRing.classList.add('hovering'));
                el.addEventListener('mouseleave', () => cursorRing.classList.remove('hovering'));
            });
        }
        bindCursorHover();

        window.addEventListener('mousemove', (e) => {
            cursorX = e.clientX; cursorY = e.clientY;
            globalMouseX = e.clientX; globalMouseY = e.clientY;
            if(cursorDot) cursorDot.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
        });

        /* ==================== 粒子系统 ==================== */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        
        // 动态主题将由 AI 生成的数据填充
        let themes = {
            'dark': { color: 'rgba(255, 255, 255, 0.1)', speed: 0.2, size: 1.5, type: 'stars', ambient: 'radial-gradient(circle at 50% 50%, #1c1c28 0%, #07070b 100%)' },
            'vortex':{ color: 'mixed', speed: 5.0, size: 1.5, type: 'vortex', ambient: 'radial-gradient(circle at 50% 50%, #000000 0%, #0f0714 100%)' }
        };
        let currentTheme = themes['dark'];
        
        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; initParticles(); }
        window.addEventListener('resize', resize);

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.baseSize = Math.random() * 2 + 0.5; this.size = this.baseSize;
                this.angle = Math.random() * Math.PI * 2; this.isPrimary = Math.random() > 0.5;
            }
            update(theme) {
                if (theme.type === 'stars') {
                    this.y -= theme.speed * (this.baseSize / 2); this.x += Math.sin(this.angle) * 0.2; this.angle += 0.01;
                } else if (theme.type === 'flow') {
                    this.x += theme.speed * 1.5; this.y -= theme.speed * 2;
                } else if (theme.type === 'float') {
                    this.y += Math.sin(this.angle) * theme.speed; this.x += Math.cos(this.angle) * theme.speed; this.angle += 0.02;
                } else if (theme.type === 'vortex') {
                    let dx = this.x - width/2, dy = this.y - height/2;
                    let r = Math.sqrt(dx*dx + dy*dy), theta = Math.atan2(dy, dx);
                    theta += theme.speed / Math.max(r, 10); r *= 0.94;
                    this.x = width/2 + r * Math.cos(theta); this.y = height/2 + r * Math.sin(theta);
                    if(r < 10) this.reset();
                }

                if(theme.type !== 'vortex') {
                    let dxMouse = this.x - globalMouseX, dyMouse = this.y - globalMouseY;
                    let distMouse = dxMouse*dxMouse + dyMouse*dyMouse;
                    if(distMouse < 25000) {
                        let force = (25000 - distMouse) / 25000;
                        this.x += dxMouse * force * 0.03; this.y += dyMouse * force * 0.03;
                        ctx.beginPath(); ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 * force})`;
                        ctx.moveTo(this.x, this.y); ctx.lineTo(globalMouseX, globalMouseY); ctx.stroke();
                    }
                }
                if (this.y < -10) this.y = height + 10; if (this.y > height + 10) this.y = -10;
                if (this.x < -10) this.x = width + 10; if (this.x > width + 10) this.x = -10;
            }
            draw(ctx, theme) {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.baseSize * theme.size, 0, Math.PI * 2);
                if (theme.color === 'mixed') { ctx.fillStyle = this.isPrimary ? theme.color1 : theme.color2; } 
                else { ctx.fillStyle = theme.color; }
                ctx.fill();
            }
        }

        function initParticles() {
            particles = []; const particleCount = Math.floor((width * height) / 10000); 
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        }

        function updateCanvasTheme(themeName) {
            currentTheme = themes[themeName] || themes['dark'];
            const ambient = document.getElementById('ambient-light');
            if(ambient) ambient.style.background = currentTheme.ambient;
        }

        function animate() {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';
            
            for(let i=0; i<particles.length; i++) {
                let p1 = particles[i]; p1.update(currentTheme); p1.draw(ctx, currentTheme);
                if (currentTheme.type !== 'stars') {
                    for(let j=i+1; j<particles.length; j++) {
                        let p2 = particles[j], dx = p1.x - p2.x, dy = p1.y - p2.y, dist = dx*dx + dy*dy;
                        if(dist < 15000) {
                            ctx.beginPath(); let opacity = 0.15 - (dist / 100000);
                            if(currentTheme.color === 'mixed') {
                                ctx.strokeStyle = p1.isPrimary ? currentTheme.color1.replace(/[\d\.]+\)$/g, `${opacity})`) : currentTheme.color2.replace(/[\d\.]+\)$/g, `${opacity})`);
                            } else { ctx.strokeStyle = currentTheme.color.replace(/[\d\.]+\)$/g, `${opacity})`); }
                            ctx.lineWidth = 1; ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                        }
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        resize(); animate();

        /* ==================== 演示交互逻辑 ==================== */
        function triggerLiquidTransition() {
            let disp = document.getElementById('fe-disp');
            if(!disp) return;
            let val = 100; disp.setAttribute('scale', val);
            let liquidInterval = setInterval(() => {
                val *= 0.85; disp.setAttribute('scale', val);
                if(val < 0.5) { disp.setAttribute('scale', 0); clearInterval(liquidInterval); }
            }, 16);
        }

        function goToScene(index) {
            if (isAnimating || index < 0 || index >= scenes.length || index === currentScene) return;
            isAnimating = true; triggerLiquidTransition();

            const nextTheme = scenes[index].getAttribute('data-theme');
            updateCanvasTheme(nextTheme);

            if (index > currentScene) {
                scenes[currentScene].classList.remove('active'); scenes[currentScene].classList.add('past');
            } else {
                scenes[currentScene].classList.remove('active'); scenes[currentScene].classList.remove('past');
                scenes[index].classList.remove('past');
            }
            currentScene = index; scenes[currentScene].classList.add('active');

            const indicator = document.getElementById('indicator');
            if(currentScene >= scenes.length - 1) { indicator.style.opacity = '0'; } 
            else { indicator.style.opacity = '0.5'; }

            setTimeout(() => { isAnimating = false; }, 1800);
        }

        function bindPresentationEvents() {
            window.addEventListener('wheel', (e) => {
                if (isAnimating || document.getElementById('scene-container').style.display === 'none') return;
                if (e.deltaY > 50) goToScene(currentScene + 1);
                else if (e.deltaY < -50) goToScene(currentScene - 1);
            });

            window.addEventListener('keydown', (e) => {
                if (document.getElementById('scene-container').style.display === 'none') return;
                if(e.target.tagName.toLowerCase() === 'input') return;
                if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') goToScene(currentScene + 1);
                if (e.key === 'ArrowUp' || e.key === 'PageUp') goToScene(currentScene - 1);
            });

            let touchStartY = 0;
            window.addEventListener('touchstart', e => { touchStartY = e.changedTouches[0].screenY; }, { passive: true });
            window.addEventListener('touchend', e => {
                if (isAnimating || document.getElementById('scene-container').style.display === 'none') return;
                const swipeDistance = touchStartY - e.changedTouches[0].screenY;
                if (swipeDistance > 50) goToScene(currentScene + 1);
                else if (swipeDistance < -50) goToScene(currentScene - 1);
            });
        }

        /* ==================== 核心生成逻辑 (Gemini API) ==================== */
        const btnGenerate = document.getElementById('btn-generate');
        const inputName = document.getElementById('input-name');
        const inputAspiration = document.getElementById('input-aspiration');
        const landingScreen = document.getElementById('landing-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const sceneContainer = document.getElementById('scene-container');
        const indicatorEl = document.getElementById('indicator');
        const loadingMsg = document.getElementById('loading-msg');

        async function fetchGeminiWithBackoff(prompt, maxRetries = 5) {
            // 请求我们自己的 Vercel 免费后端接口，不再直接请求 Google，完美避开国内网络限制
            const url = `/api/oracle`; 
            
            let retries = 0; 
            const delays = [1000, 2000, 4000, 8000];
            
            while (retries <= maxRetries) {
                try {
                    const response = await fetch(url, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ prompt: prompt }) 
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error`);
                    
                    const data = await response.json();
                    return JSON.parse(data.candidates[0].content.parts[0].text);
                } catch (error) {
                    if (retries === maxRetries) return null;
                    await new Promise(r => setTimeout(r, delays[retries])); 
                    retries++;
                }
            }
        }


        // 动态构建 HTML 幻灯片并注入
        function buildPresentation(data) {
            const nameFull = data.part1.text + data.part2.text;
            
            // 写入动态色彩到CSS变量
            document.documentElement.style.setProperty('--color-p1', data.part1.colorHex);
            document.documentElement.style.setProperty('--color-p2', data.part2.colorHex);
            
            // 动态注册主题
            themes['p1'] = { color: hexToRgba(data.part1.colorHex, 0.5), speed: 0.8, size: 3, type: 'float', ambient: `radial-gradient(circle at 30% 70%, ${hexToRgba(data.part1.colorHex, 0.25)} 0%, #04080c 100%)` };
            themes['p2'] = { color: hexToRgba(data.part2.colorHex, 0.5), speed: 1.2, size: 2.5, type: 'flow', ambient: `radial-gradient(circle at 70% 30%, ${hexToRgba(data.part2.colorHex, 0.15)} 0%, #0d0606 100%)` };
            themes['fusion'] = { color: 'mixed', color1: hexToRgba(data.part1.colorHex, 0.4), color2: hexToRgba(data.part2.colorHex, 0.4), speed: 0.8, size: 2, type: 'flow', ambient: `radial-gradient(circle at 50% 50%, ${hexToRgba(data.part1.colorHex, 0.15)} 0%, ${hexToRgba(data.part2.colorHex, 0.1)} 60%, #080709 100%)` };

            const htmlContent = `
                <!-- Scene 0: 封面 -->
                <div class="scene active" data-theme="dark">
                    <div class="bg-char cursive anim-element delay-300" style="transform: scale(1.5); opacity: 0.1;">源</div>
                    <h1 class="cursive text-8xl md:text-[10rem] text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500 anim-element">${nameFull}</h1>
                    <div class="glow-line mt-8"></div>
                    <p class="mt-8 tracking-[1em] text-gray-400 text-sm anim-element delay-500 pl-[1em]">${data.subtitle}</p>
                </div>

                <!-- Scene 1: 拆解部分 1 -->
                <div class="scene" data-theme="p1">
                    <div class="cursive text-[15rem] md:text-[25rem] text-hollow text-hollow-p1 absolute z-0 anim-element opacity-20">${data.part1.text}</div>
                    <div class="z-10 text-center mix-blend-difference px-8">
                        <h2 class="text-4xl md:text-6xl font-light tracking-widest anim-element delay-300 text-white">${data.part1.concept}</h2>
                        <div class="w-12 h-px bg-[var(--color-p1)] mx-auto mt-6 mb-8 anim-element delay-500"></div>
                        <p class="text-xl md:text-2xl text-gray-300 tracking-widest leading-loose anim-element delay-700 max-w-2xl mx-auto font-light">
                            ${data.part1.desc}
                        </p>
                    </div>
                </div>

                <!-- Scene 2: 拆解部分 2 -->
                <div class="scene" data-theme="p2">
                    <div class="cursive text-[15rem] md:text-[25rem] text-hollow text-hollow-p2 absolute z-0 anim-element opacity-20">${data.part2.text}</div>
                    <div class="z-10 text-center mix-blend-difference px-8">
                        <h2 class="text-4xl md:text-6xl font-light tracking-widest anim-element delay-300 text-white">${data.part2.concept}</h2>
                        <div class="w-12 h-px bg-[var(--color-p2)] mx-auto mt-6 mb-8 anim-element delay-500"></div>
                        <p class="text-xl md:text-2xl text-gray-300 tracking-widest leading-loose anim-element delay-700 max-w-2xl mx-auto font-light">
                            ${data.part2.desc}
                        </p>
                    </div>
                </div>

                <!-- Scene 3: 交融升华 -->
                <div class="scene" data-theme="fusion">
                    <div class="text-center w-full px-8 z-10 anim-element">
                        <div class="flex items-center justify-center gap-6 mb-12">
                            <span class="cursive text-7xl md:text-8xl text-p1">${data.part1.text}</span>
                            <span class="text-3xl text-gray-500 font-light mx-4">X</span>
                            <span class="cursive text-7xl md:text-8xl text-p2">${data.part2.text}</span>
                        </div>
                        <h2 class="text-3xl md:text-4xl text-white mb-6 tracking-widest font-light">${data.synthesisTitle}</h2>
                        <p class="text-lg text-gray-400 tracking-widest leading-relaxed max-w-2xl mx-auto font-light">${data.synthesisDesc}</p>
                    </div>
                </div>

                <!-- Scene 4: 终章寄语 -->
                <div class="scene" data-theme="dark">
                    <div class="text-center px-8">
                        <h3 class="text-xs tracking-[1em] text-gray-600 mb-12 uppercase anim-element pl-[1em]">The Blessing</h3>
                        <div class="text-3xl md:text-5xl cursive text-white leading-[2] anim-element delay-300">
                            ${data.blessing}
                        </div>
                        <div class="mt-20 anim-element delay-700">
                            <div class="w-12 h-12 border border-gray-600 mx-auto flex items-center justify-center p-1 rounded-sm rotate-45">
                                <div class="w-full h-full border border-gray-600 flex items-center justify-center -rotate-45">
                                    <span class="cursive text-gray-400 text-sm">${nameFull}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            sceneContainer.innerHTML = htmlContent;
            scenes = document.querySelectorAll('.scene');
            bindCursorHover(); // 重新绑定光标事件
        }

        btnGenerate.addEventListener('click', async () => {
            const name = inputName.value.trim();
            const aspiration = inputAspiration.value.trim();

            if (!name) {
                inputName.focus();
                inputName.style.borderBottomColor = 'red'; setTimeout(() => inputName.style.borderBottomColor = 'rgba(255,255,255,0.3)', 1000);
                return;
            }

            // 切换到加载屏
            landingScreen.style.opacity = '0';
            landingScreen.style.pointerEvents = 'none';
            setTimeout(() => {
                landingScreen.style.display = 'none';
                loadingScreen.style.display = 'flex';
                setTimeout(()=> loadingScreen.style.opacity = '1', 50);
            }, 1000);

            updateCanvasTheme('vortex');

            const loadingTexts = ["剖析星盘轨迹...", "注入美学色彩...", "编织诗意判词...", "即将开启..."];
            let textIdx = 0;
            const textInterval = setInterval(()=> { loadingMsg.innerText = loadingTexts[textIdx++ % loadingTexts.length]; }, 1500);

            const prompt = `用户名字：${name}。心境：${aspiration || '顺其自然'}。`;
            const resultData = await fetchGeminiWithBackoff(prompt);

            clearInterval(textInterval);

            if(resultData) {
                buildPresentation(resultData);
                
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    sceneContainer.style.display = 'block';
                    indicatorEl.style.display = 'flex';
                    
                    updateCanvasTheme('dark');
                    currentScene = 0;
                    bindPresentationEvents();
                    triggerLiquidTransition();
                    
                    setTimeout(() => indicatorEl.style.opacity = '0.5', 1000);
                }, 1000);

            } else {
                loadingMsg.innerText = "星辰黯淡，生成失败。请刷新重试。";
                loadingMsg.style.color = "red";
                updateCanvasTheme('dark');
            }
        });

    </script>
</body>
</html>
